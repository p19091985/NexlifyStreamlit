[database]
# ======================================================================
# INSTRUÇÕES DE USO:
# Para usar um banco de dados, descomente a seção correspondente
# (removendo o '#' do início de cada linha) e comente as outras.
# Apenas UMA configuração de banco de dados deve estar ativa por vez.
#
# O nome do banco de dados padrão é 'nexlifyttk' e o usuário/senha
# padrão são 'gato' e '-Vladmir!5Anos-', conforme os scripts de
# criação manual. Ajuste se necessário.
# ======================================================================


#  Configuração para Microsoft SQL Server (INATIVA)
# Requer um servidor SQL Server rodando e o driver pymssql.
# Instale com: pip install pymssql
#
#type = sqlserver
#host = localhost
#port = 1433
#dbname = nexlifyttk
#user = sa
#password = senha_forte

#  Configuração para SQLite (INATIVA)
# Não requer instalação de servidor. O banco será um arquivo local.
# O caminho (path) é relativo à pasta raiz do projeto.

type = sqlite
path = nexlifyttk.db


#  Configuração para PostgreSQL (ATIVA)
# Requer um servidor PostgreSQL rodando e o driver psycopg2.
# Instale com: pip install psycopg2-binary
#
#type = postgresql
#host = localhost
#port = 5432
#dbname = nexlifyttk
#user = postgres
#password = senha_forte


#  Configuração para MySQL (INATIVA)
# Requer um servidor MySQL rodando e o driver PyMySQL.
# Instale com: pip install PyMySQL
#
#type = mysql
#host = localhost
#port = 3306
#dbname = nexlifyttk
#user = root
#password = senha_forte


#  Configuração para MariaDB (INATIVA)
# Requer um servidor MariaDB rodando e o driver mariadb.
# Instale com: pip install mariadb
#

#type = mariadb
#host = localhost
#port = 3306
#dbname = nexlifyttk
#user = root
#password = senha_forte
